<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="https://fonts.google.com/specimen/Inter">
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="profile">
        <div class="image-container">
          <img src="./assets/images/avatar-jessica.jpeg" alt="">
        </div>
        <h2>Jessica Randall</h2>
        <p class="location">London, United Kingdom</p>
        <p class="bio">"Front-end developer and avid reader."</p>
      </div>
      <div class="link">GitHub</div>
      <div class="link">Frontend Mentor</div>
      <div class="link">LinkedIn</div>
      <div class="link">Twitter</div>
      <div class="link">Instagram</div>
    </div>
  </div>
  <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://github.com/Thet81" target="_blank">Thet Naing Oo</a>.
  </div>
</body>
</html>
